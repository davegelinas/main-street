name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Scaffold a fresh site
        run: node scripts/new-site.mjs /tmp/site

      - name: Install
        run: cd /tmp/site && npm install --no-audit --no-fund

      - name: Setup wizard (defaults)
        run: cd /tmp/site && npm run setup < /dev/null

      - name: Typecheck
        run: cd /tmp/site && npm run typecheck

      - name: Build
        run: cd /tmp/site && npm run build

      - name: Audit
        # python3 http.server returns true 404s like Cloudflare Pages does.
        # (vite preview serves index.html for unknown routes, so the 404
        # check would fail against it. The audit is meant for deployed URLs.)
        run: |
          cd /tmp/site/dist
          (python3 -m http.server 4173 >/tmp/preview.log 2>&1 &)
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ >/dev/null && break
            sleep 1
          done
          cd /tmp/site
          node scripts/audit-site.mjs http://localhost:4173

      - name: Tricky business details
        # Quotes, ampersands, emoji, loosely written hours and missing fields
        # must build, keep the HTML well-formed, and never put wrong hours in
        # Google's data. Runs last: it rebuilds dist/ with a test config.
        run: node scripts/check-tricky-config.mjs /tmp/site
