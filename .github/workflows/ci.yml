name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Scaffold a fresh site
        run: node scripts/new-site.mjs /tmp/site

      - name: Install
        run: cd /tmp/site && npm install --no-audit --no-fund

      - name: Setup wizard (defaults)
        run: cd /tmp/site && npm run setup < /dev/null

      - name: Typecheck
        run: cd /tmp/site && npm run typecheck

      - name: Build
        run: cd /tmp/site && npm run build

      - name: Audit
        # wrangler dev serves dist/ the way Cloudflare does (real 404s,
        # _headers, _redirects) and runs the contact form code. Everything is
        # simulated on this machine: no Cloudflare login.
        run: |
          cd /tmp/site
          (npx wrangler dev --port 4173 --ip 127.0.0.1 >/tmp/wrangler.log 2>&1 &)
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          node scripts/audit-site.mjs http://127.0.0.1:4173
          # With no email settings the form says "email us directly" (503).
          curl -s http://127.0.0.1:4173/api/contact | grep -q '"ready":false'
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Content-Type: application/json' \
            -d '{"name":"CI","email":"ci@example.org","message":"hi","leave_blank":"","elapsed":5000}' \
            http://127.0.0.1:4173/api/contact)
          test "$code" = 503
          # Preview links are hidden from search engines.
          curl -s -D - -o /dev/null -H 'Host: x-my-website.acct.workers.dev' http://127.0.0.1:4173/ | grep -qi '^x-robots-tag: noindex'

      - name: Tricky business details
        # Quotes, ampersands, emoji, loosely written hours and missing fields
        # must build, keep the HTML well-formed, and never put wrong hours in
        # Google's data. Runs last: it rebuilds dist/ with a test config.
        run: node scripts/check-tricky-config.mjs /tmp/site
